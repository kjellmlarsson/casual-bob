# HTTP server
quarkus.http.port=8080

# Casual IronJacamar Resource Adapter (Outbound Pool)
quarkus.ironjacamar.casual.ra.kind=casual
quarkus.ironjacamar.casual.ra.config.host=${CASUAL_HOST:casual}
quarkus.ironjacamar.casual.ra.config.port=${CASUAL_PORT:7771}
quarkus.ironjacamar.casual.ra.config.network-connection-pool-size=1
quarkus.ironjacamar.casual.ra.config.network-connection-pool-name=casual-pool
quarkus.ironjacamar.casual.ra.config.inbound-server-port=7772

# Virtual Threads
quarkus.virtual-threads.enabled=true

# Logging
quarkus.log.category."org.jboss.jca.core.connectionmanager".level=ERROR

# Test profile overrides
%test.quarkus.shutdown.timeout=0s
%test.quarkus.shutdown.delay-enabled=false
