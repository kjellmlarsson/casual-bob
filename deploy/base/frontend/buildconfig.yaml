apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: casual-bob-frontend
spec:
  source:
    type: Git
    git:
      uri: https://github.com/kjellmlarsson/casual-bob.git
      ref: main
    contextDir: frontend
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Containerfile
  output:
    to:
      kind: ImageStreamTag
      name: casual-bob-frontend:latest
