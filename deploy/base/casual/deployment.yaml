apiVersion: apps/v1
kind: Deployment
metadata:
  name: casual
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"catfacts:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"casual\")].image"},
       {"from":{"kind":"ImageStreamTag","name":"catfacts:latest"},"fieldPath":"spec.template.spec.initContainers[?(@.name==\"init-state\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app: casual
  template:
    metadata:
      labels:
        app: casual
    spec:
      # An emptyDir hides the domain directory baked into the image (configuration, logs).
      # Copy it into the volume first.
      initContainers:
        - name: init-state
          # Placeholder; replaced by the image.openshift.io/triggers annotation.
          image: catfacts:latest
          command: ["sh", "-c", "cp -R /test/casual/. /state/"]
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /state
      containers:
        - name: casual
          # Placeholder; replaced by the image.openshift.io/triggers annotation.
          image: catfacts:latest
          ports:
            - containerPort: 7771
          readinessProbe:
            tcpSocket:
              port: 7771
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: state
              mountPath: /test/casual
            # Casual creates its IPC directory in /tmp/.casual; the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          emptyDir: {}
        - name: tmp
          emptyDir: {}
